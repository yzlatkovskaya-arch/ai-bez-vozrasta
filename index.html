<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нейросети без возраста</title>
<style>
:root {
  --bg: #fbf6ee;
  --text: #2b2622;
  --muted: #6b6259;
  --accent: #b4501e;
  --accent-text: #ffffff;
  --card: #fffdf9;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 18px;
  line-height: 1.6;
  overflow-wrap: break-word;
}

.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding-left: 20px;
  padding-right: 20px;
}

section {
  padding-top: 56px;
  padding-bottom: 56px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 56px;
  padding: 12px 28px;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-text);
  font: inherit;
  font-weight: 600;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}

.btn:focus-visible {
  outline: 3px solid var(--text);
  outline-offset: 3px;
}
</style>
</head>
<body>
<main>
  <section id="hero"></section>
  <section id="fears"></section>
  <section id="benefits"></section>
  <section id="signup"></section>
</main>
<script>
</script>
</body>
</html>
