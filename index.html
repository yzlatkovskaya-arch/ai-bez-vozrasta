<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нейросети без возраста</title>
<style>
:root {
  --bg: #fbf6ee;
  --text: #2b2622;
  --muted: #6b6259;
  --accent: #b4501e;
  --accent-text: #ffffff;
  --card: #fffdf9;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 18px;
  line-height: 1.6;
  overflow-wrap: break-word;
}

.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding-left: 20px;
  padding-right: 20px;
}

section {
  padding-top: 56px;
  padding-bottom: 56px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 56px;
  padding: 12px 28px;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-text);
  font: inherit;
  font-weight: 600;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}

.btn:focus-visible {
  outline: 3px solid var(--text);
  outline-offset: 3px;
}

#hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  padding-top: 32px;
  padding-bottom: 32px;
}

#hero h1 {
  margin: 0 0 16px;
  font-size: 2.2rem;
  line-height: 1.15;
}

#hero .lead {
  margin: 0 0 28px;
}

#hero .btn {
  width: 100%;
}

#hero .note {
  margin: 12px 0 0;
  font-size: 0.9em;
  color: var(--muted);
  text-align: center;
}

@media (min-width: 600px) {
  #hero h1 { font-size: 3rem; }
  #hero .btn { width: auto; }
  #hero .note { text-align: left; }
}
</style>
</head>
<body>
<main>
  <section id="hero">
    <div class="wrap">
      <h1>Вы не опоздали к нейросетям</h1>
      <p class="lead">Бесплатный вебинар по ИИ для работающих людей 45+: без жаргона и в спокойном темпе, чтобы разговаривать с детьми и коллегами на равных.</p>
      <a class="btn" href="#signup">Записаться на бесплатный вебинар</a>
      <p class="note">Бесплатно. Дату сообщим после записи</p>
    </div>
  </section>
  <section id="fears"></section>
  <section id="benefits"></section>
  <section id="signup"></section>
</main>
<script>
</script>
</body>
</html>
